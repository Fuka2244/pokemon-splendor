<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10152a" />
    <meta name="description" content="出包魔法师与宝可梦璀璨宝石游戏入口。" />
    <title>牌局入口 · 两款游戏</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #10152a;
        color: #f4f3f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 16% 8%, rgb(103 78 199 / 22%), transparent 36rem),
          radial-gradient(ellipse at 88% 23%, rgb(50 133 202 / 18%), transparent 34rem),
          #10152a;
      }

      a { color: inherit; text-decoration: none; }

      .shell {
        width: min(1100px, calc(100% - 40px));
        margin: 0 auto;
        padding: 32px 0 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #c9c7d5;
        font-size: 13px;
        letter-spacing: .08em;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 11px;
        background: linear-gradient(145deg, #a383ff, #5db7f1);
        color: #10152a;
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .hero { padding: 82px 0 42px; }

      .eyebrow {
        margin: 0 0 16px;
        color: #b5a0ff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .2em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(38px, 7vw, 68px);
        line-height: 1.12;
        letter-spacing: -.045em;
      }

      .intro {
        max-width: 580px;
        margin: 20px 0 0;
        color: #aaaebe;
        font-size: 16px;
        line-height: 1.8;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .game-card {
        position: relative;
        display: flex;
        min-height: 310px;
        flex-direction: column;
        align-items: flex-start;
        overflow: hidden;
        padding: 28px;
        border: 1px solid rgb(255 255 255 / 11%);
        border-radius: 22px;
        background: linear-gradient(145deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 3%));
        box-shadow: 0 20px 60px rgb(0 0 0 / 17%);
        transition: transform .2s ease, border-color .2s ease, background .2s ease;
      }

      .game-card::after {
        position: absolute;
        z-index: 0;
        top: -88px;
        right: -66px;
        width: 230px;
        height: 230px;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 50%;
        content: "";
        box-shadow: 0 0 0 28px rgb(255 255 255 / 2%), 0 0 0 58px rgb(255 255 255 / 2%);
        pointer-events: none;
      }

      .game-card:hover, .game-card:focus-visible {
        transform: translateY(-4px);
        border-color: rgb(255 255 255 / 27%);
        background: linear-gradient(145deg, rgb(255 255 255 / 13%), rgb(255 255 255 / 5%));
        outline: none;
      }

      .spell { --accent: #b69aff; --accent-soft: rgb(182 154 255 / 13%); }
      .splendor { --accent: #78c8fa; --accent-soft: rgb(120 200 250 / 13%); }

      .game-icon, .game-name, .game-desc, .tags, .open-game { position: relative; z-index: 1; }

      .game-icon {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        margin-bottom: 25px;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 66%);
        border-radius: 16px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 25px;
      }

      .game-name { margin: 0; font-size: 25px; letter-spacing: -.025em; }

      .game-desc {
        max-width: 390px;
        margin: 12px 0 0;
        color: #b4b6c6;
        font-size: 14px;
        line-height: 1.75;
      }

      .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 17px; }

      .tag {
        padding: 6px 10px;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 999px;
        color: #c5c6d2;
        font-size: 11px;
      }

      .open-game {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: auto;
        padding-top: 26px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
      }

      .arrow { font-size: 19px; transition: transform .2s ease; }
      .game-card:hover .arrow { transform: translateX(4px); }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 32px;
        padding-top: 18px;
        border-top: 1px solid rgb(255 255 255 / 9%);
        color: #777d93;
        font-size: 12px;
      }

      @media (max-width: 700px) {
        .shell { width: min(100% - 28px, 540px); padding-top: 20px; }
        .hero { padding: 62px 0 30px; }
        .games { grid-template-columns: 1fr; }
        .game-card { min-height: 285px; padding: 24px; }
        footer { flex-direction: column; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topbar" aria-label="牌局入口">
        <span class="brand-mark" aria-hidden="true">♧</span>
        <span>牌局入口</span>
      </div>

      <header class="hero">
        <p class="eyebrow">Choose your table</p>
        <h1>选一款，<br />开一桌。</h1>
        <p class="intro">两款不同的桌游，都在这里开始。叫上朋友，挑一场喜欢的牌局。</p>
      </header>

      <section class="games" aria-label="选择游戏">
        <a class="game-card spell" href="http://47.109.91.102:8787/" aria-label="进入出包魔法师">
          <span class="game-icon" aria-hidden="true">✦</span>
          <h2 class="game-name">出包魔法师</h2>
          <p class="game-desc">看清每个人的咒印，唯独看不见自己的。观察、推理，再决定何时施法。</p>
          <span class="tags" aria-hidden="true">
            <span class="tag">2–4 人</span>
            <span class="tag">好友联机</span>
            <span class="tag">隐藏推理</span>
          </span>
          <span class="open-game">进入游戏 <span class="arrow" aria-hidden="true">→</span></span>
        </a>

        <a class="game-card splendor" href="http://47.109.91.102:4174/" aria-label="进入宝可梦璀璨宝石">
          <span class="game-icon" aria-hidden="true">◈</span>
          <h2 class="game-name">宝可梦璀璨宝石</h2>
          <p class="game-desc">收集精灵球，捕捉宝可梦，积累永久折扣，逐步完成你的收藏。</p>
          <span class="tags" aria-hidden="true">
            <span class="tag">2–4 人</span>
            <span class="tag">本地体验</span>
            <span class="tag">好友联机</span>
          </span>
          <span class="open-game">进入游戏 <span class="arrow" aria-hidden="true">→</span></span>
        </a>
      </section>

      <footer>
        <span>同一入口 · 两种牌局</span>
        <span>好友聚齐后，开始游戏。</span>
      </footer>
    </main>
  </body>
</html>
